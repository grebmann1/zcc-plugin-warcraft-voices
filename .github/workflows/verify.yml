name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin
      # The SDK is not on npm yet. Pack the public host SDK used by this release.
      - uses: actions/checkout@v7
        with:
          repository: salesforce/zana
          ref: 9189ad843227d39e8d92796b48fa0e3b2979d899
          path: host
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: host/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
        working-directory: host
      - run: pnpm --filter @zana-ai/zcc-plugin-sdk pack --pack-destination "$RUNNER_TEMP/sdk"
        working-directory: host
      - run: npm install --no-save --package-lock=false "$RUNNER_TEMP/sdk/zana-ai-zcc-plugin-sdk-0.1.0.tgz"
        working-directory: plugin
      - run: npm test -- --coverage
        working-directory: plugin
      - run: npm run typecheck
        working-directory: plugin
      - run: node --check app.js && node --check server.mjs
        working-directory: plugin
